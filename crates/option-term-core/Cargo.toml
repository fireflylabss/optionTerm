[package]
name = "option-term-core"
version = "0.2.12"
edition = "2024"
description = "GTK-free core modules shared by optionTerm frontends"
license = "Apache-2.0"

[lib]
name = "option_term_core"

[features]
test-support = []

[dependencies]
anyhow = "1"
optionSDK = "0.1.3"
dirs = "6"
nix = { version = "0.30", features = ["term", "fs", "process", "signal"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
