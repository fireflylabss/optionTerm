[package]
name = "option-term-vt"
version = "0.2.12"
edition = "2024"
description = "UI-agnostic terminal emulation core for optionTerm, built on libghostty-vt"
license = "Apache-2.0"

[lib]
name = "option_term_vt"

[dependencies]
anyhow = "1"
bitflags = "2"
dirs = "6"
# crates.io 0.2.1 pins a Ghostty that requires Zig 0.15.2 exactly; master
# builds with Zig 0.16.x (the installed version).
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "5988a0b78b4aa804d1c12e66bbfe662bd97d81c0", features = ["kitty-graphics"] }
nix = { version = "0.30", features = ["term", "fs", "process", "signal", "poll", "user", "ioctl"] }
option-term-core = { path = "../option-term-core" }
png = "0.18"
tracing = "0.1"

[dev-dependencies]
flate2 = "1"
tempfile = "3"
