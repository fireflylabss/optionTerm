[package]
name = "option-term-gpui"
version = "0.2.12"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "GPUI frontend for optionTerm, on top of option-term-vt"

[lib]
name = "option_term_gpui"
path = "src/lib.rs"

[[bin]]
name = "optionterm-next"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", features = ["wayland", "x11"] }
option-term-core = { path = "../option-term-core" }
option-term-vt = { path = "../option-term-vt" }
anyhow = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "7733b9922665f103abda7c6a3fde6b9dfdc8eba9", default-features = false, features = ["test-support"] }
