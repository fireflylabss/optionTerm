[package]
name = "optionterm"
version = "0.2.3"
edition = "2024"
description = "Sidebar-first GTK4 terminal with tiling splits and Adwaita preferences"
license = "Apache-2.0"
repository = "https://github.com/fireflylabss/optionTerm"
default-run = "optionterm"

[[bin]]
name = "optionterm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
optionSDK = "0.1.3"
dirs = "6"
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
nix = { version = "0.30", features = ["term", "fs", "process", "signal", "user", "ioctl"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vte4 = { version = "0.8", features = ["v0_76"] }
webkit6 = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
